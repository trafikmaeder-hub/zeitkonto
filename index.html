<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9edeb; --line:#d3dad7; --fg:#18211e; --muted:#5d6b66;
  --accent:#0f6b5c; --accent-fg:#ffffff; --accent-soft:#dcefea;
  --ok:#1f7a3a; --ok-soft:#e1f2e5; --warn:#9a5a00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#f9e1df;
  --hol:#fbf1e4; --wkend:#eef1f0;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111816; --surface:#18211e; --sunk:#202b27; --line:#2f3d38; --fg:#e4ebe8; --muted:#97a6a0;
  --accent:#4fbfa8; --accent-fg:#0b1a16; --accent-soft:#16342d;
  --ok:#6cc985; --ok-soft:#173022; --warn:#e5ac52; --warn-soft:#33270f; --bad:#f08a80; --bad-soft:#3a1a17;
  --hol:#2c2417; --wkend:#1c2522; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 13px var(--mono)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.role{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--sans);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/18px var(--sans);text-align:center}
main{padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:19px} h3{font-size:15px}
.sec{display:grid;gap:12px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid2>*,.form>*{min-width:0}
.tablebox input[type=time]{min-width:96px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .val{font:500 24px var(--mono);font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--sans);padding:8px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.big{font-size:18px;padding:14px 26px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:400 16px var(--sans);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
input[type=time],input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg)}
.check input[type=checkbox]{flex:0 0 auto;width:18px;height:18px;margin:0}
.check:has(input[type=checkbox]){align-items:flex-start}
.check:has(input[type=checkbox]) input[type=checkbox]{margin-top:1px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;align-items:end}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.we td{background:var(--wkend)} tr.hol td{background:var(--hol)}
tr.today td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.zt input[type=time]{width:96px;padding:4px 6px;font-size:14px}
.zt input.pz{width:64px;padding:4px 6px;font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.U{background:var(--accent-soft);color:var(--accent)} .chip.K,.chip.A{background:var(--warn-soft);color:var(--warn)} .chip.F{background:var(--hol);color:var(--warn)} .chip.BS{background:#d9efe9;color:#1d5c4f} .chip.SF{background:var(--hol);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.open{background:var(--warn-soft);color:var(--warn)}
.hint{color:var(--bad);font-size:12px;white-space:normal;min-width:150px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.item .meta{font-size:13px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.callout{padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);display:grid;gap:8px}
.callout.warn{background:var(--warn-soft)}
.cred{font-family:var(--mono);font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;user-select:all}
.clock{font:500 44px var(--mono);font-variant-numeric:tabular-nums}
.slots{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:14px}
.slots span{padding:4px 8px;border-radius:6px;background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.mw{max-width:68ch}
.hrow{display:grid;grid-template-columns:repeat(7,minmax(46px,1fr));gap:6px}
.hrow label{font-size:12px;color:var(--muted);display:grid;gap:3px;text-align:center}
.hrow input{text-align:center;padding:6px 4px}
.login{max-width:420px;margin:8vh auto 0}
.kiosk{display:grid;gap:20px;justify-items:center;text-align:center;padding-block:6vh}
.kiosk .name{font-size:28px;font-weight:600}
.kiosk .huge{font-size:24px;padding:22px 48px;border-radius:12px}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:b 1s linear infinite;z-index:30}
@keyframes b{from{background-position:200% 0}to{background-position:-200% 0}}
.cal{border-collapse:separate;border-spacing:0;width:auto}
.cal th,.cal td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:12px;height:30px;min-width:30px;white-space:nowrap}
.cal th{position:sticky;top:0;z-index:1;font-size:11px;letter-spacing:0;text-transform:none;padding:3px 0;line-height:1.2}
.cal .nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 10px;min-width:150px;max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.cal th.nm{z-index:3;background:var(--sunk)}
.cal td.we,.cal th.we{background:var(--wkend)} .cal td.ho,.cal th.ho{background:var(--hol)}
.cal td.free{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--sunk) 4px 6px)}
.cal th.td{box-shadow:inset 0 -3px 0 var(--accent)}
.cal .ab{display:block;height:100%;line-height:30px;font-weight:600;font-size:11px}
.cal .ab.U{background:var(--accent);color:var(--accent-fg)}
.cal .ab.K{background:var(--warn);color:var(--surface)} .cal .ab.A{background:var(--warn-soft);color:var(--warn)}
.cal .ab.ZA{background:#3f6fa8;color:#fff} .cal .ab.PF,.cal .ab.SU{background:#7b5ea7;color:#fff} .cal .ab.UB{background:var(--muted);color:var(--surface)} .cal .ab.AW{background:#8a8f8d;color:#fff} .cal .ab.BS{background:#2f7d6d;color:#fff}
.cal .ab.open{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,transparent 5px 10px);color:var(--accent);outline:2px dashed var(--accent);outline-offset:-3px}
.cal .ab.storno{opacity:.55;text-decoration:line-through}
.cal .ab.thin{opacity:.45}
.cal tfoot td{font-family:var(--mono);font-size:12px;height:26px}
.cal tfoot td.low{background:var(--bad-soft);color:var(--bad);font-weight:600}
.cal tfoot td.two{background:var(--warn-soft);color:var(--warn);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend .ab{display:inline-block;min-width:26px;height:18px;line-height:18px;border-radius:3px;text-align:center;margin-right:4px}
.signov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.signbox{background:var(--surface);color:var(--fg);border-radius:12px;max-width:860px;margin:0 auto;padding:16px;display:grid;gap:12px}
.signpad{width:100%;height:190px;background:#ffffff;border:2px dashed var(--line);border-radius:10px;touch-action:none;cursor:crosshair;display:block}
.mailprev{background:#ffffff;color:#18211e;border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}
@media (prefers-reduced-motion:reduce){.busy{animation:none}}
</style>

      <button class="btn sm" data-act="pwForm">Kennwort ändern</button><button class="btn sm" data-act="logout">Abmelden</button></div>

</header>
<div class="wrap"><main id="app"><div class="empty">Wird geladen …</div></main></div>

<script>

<script>
(function(){

const {WD, MONATE, TYPES, LIM, pad, ds, addDays, wdIdx, fmtD, fmtDY, num, r2, fmtH, esc, zeitraum, changeText} = Calc;
const $ = s => document.querySelector(s);
const cls = x => x > 0.004 ? "pos" : x < -0.004 ? "neg" : "";
let toastT;
function toast(m, long){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, long ? 6000 : 3200); }

/* ---------- Zustand ---------- */
const S = { token:null, D:null, K:null, tab:null, viewUid:null, viewYm:null, year:null, pending:0,
  rejectOpen:null, note:{}, absYm:null, absHint:{}, absPreview:null, editUid:null, cred:null, loginPw:"", arch:{uid:"",typ:"",status:""},

const store = {
  get(){ try{ return localStorage.getItem("zk-token") || sessionStorage.getItem("zk-token"); }catch(e){ return null; } },
  set(t, remember){ try{ (remember ? localStorage : sessionStorage).setItem("zk-token", t); }catch(e){} },
  clear(){ try{ localStorage.removeItem("zk-token"); sessionStorage.removeItem("zk-token"); }catch(e){} }
};

/* ---------- Server ---------- */
function call(action, data){
  return new Promise((resolve, reject) => {
    S.pending++; $("#busy").hidden = false;
    const done = () => { S.pending--; if(!S.pending) $("#busy").hidden = true; };
    const onRes = res => {
      done();
      if(!res || !res.ok){
        const err = new Error(res && res.error || "Unbekannter Fehler"); err.code = res && res.code;
        if(err.code === "auth"){ logoutLocal(err.message); }
        else if(err.code === "mustChange"){ S.D = S.D || {}; renderMustChange(); }
        return reject(err);
      }
      resolve(res.data);
    };
    const onFail = () => { done(); reject(new Error("Keine Verbindung zum Server. Bitte erneut versuchen.")); };
    if(window.API_URL){  /* installierbare App unter eigener Adresse */
      fetch(window.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({token:S.token, action, data:data||{}}), redirect:"follow"})

}
function setData(p){

  if(!isMgr()) S.viewUid = p.me.id;
  render();
}
function act(action, data, okMsg){
  data = Object.assign({year:S.year}, data||{});

}

/* ---------- Anmeldung ---------- */

    <div class="brand"><span class="mark">ZK</span><span>Trafik Zeitkonto</span></div>

}

      <label class="f">Neues Kennwort wiederholen<input id="pwNew2" type="password" autocomplete="new-password" required minlength="8"></label>

function logoutLocal(msg){

/* ---------- Kiosk (gemeinsames Gerät) ---------- */
let idleT = null, kioskOutT = null;
function armIdle(){
  clearTimeout(idleT);
  if(!KIOSK || !S.token) return;
  idleT = setTimeout(() => { call("logout").catch(()=>{}); logoutLocal("Automatisch abgemeldet."); }, isMgr() ? 180000 : 45000);
}
["click","keydown","touchstart","pointerdown"].forEach(ev => document.addEventListener(ev, armIdle, {passive:true}));

/* ---------- Änderungsanträge (Zeitkorrekturen) ---------- */
function openKorr(uid){ return (S.D.korr||[]).filter(k => k.status==="offen" && (!uid || k.uid===uid)); }
function pendingFor(uid, d){ return (S.D.korr||[]).find(k => k.uid===uid && k.datum===d && k.status==="offen") || null; }
function fmtEntry(e){ e = e || {}; const z = [["b1","e1"],["b2","e2"]].filter(([b,x]) => e[b]||e[x]).map(([b,x]) => (e[b]||"?")+"–"+(e[x]||"?")).join(" / "); return (z || "leer") + (e.p ? ", Pause "+e.p+" min" : ""); }
function inputEntry(uid, d){
  const dr = (S.draft[uid]||{})[d]; if(dr) return dr;
  if(!isMgr()){ const k = pendingFor(uid, d); if(k) return Object.assign({}, k.neu, {grund:k.grund}); }
  return (S.D.zeit[uid]||{})[d] || {};
}

}

function seen(){ try{ return JSON.parse(localStorage.getItem("zk-seen")||"{}"); }catch(e){ return {}; } }

function unseenAbschl(){ const s = seen(); return S.D.abschl.filter(a => a.uid === S.D.me.id && !s["a:"+a.ym+":"+a.ts]); }

/* ---------- Monatsbericht unterschreiben ---------- */
const SIG = { cv:null, ctx:null, drawing:false, ink:0, last:null,
  init(cv){
    this.cv = cv; this.ink = 0; const r = cv.getBoundingClientRect(), dpr = Math.max(1, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const c = this.ctx = cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle = "#ffffff"; c.fillRect(0,0,r.width,r.height);
    c.lineWidth = 2.4; c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = "#0b2a6f";
    const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); this.drawing = true; this.last = pos(e); armIdle(); };
    cv.onpointermove = e => { if(!this.drawing) return; e.preventDefault(); const p = pos(e); c.beginPath(); c.moveTo(this.last[0], this.last[1]); c.lineTo(p[0], p[1]); c.stroke();
      this.ink += Math.hypot(p[0]-this.last[0], p[1]-this.last[1]); this.last = p; };
    cv.onpointerup = cv.onpointercancel = () => { this.drawing = false; armIdle(); updSignBtn(); };
  },
  clear(){ if(this.cv) this.init(this.cv); updSignBtn(); },
  png(){ const r = this.cv.getBoundingClientRect(), o = document.createElement("canvas"), w = 600, h = Math.round(600 * r.height / r.width);

/* ---------- Urlaubskalender ---------- */
function calRows(){
  const mgr = isMgr(), out = [];
  if(mgr){
    staffIds().filter(id => S.D.users[id].aktiv || S.D.abw.some(a => a.uid===id && a.status==="genehmigt")).forEach(id => {
      out.push({id, name:S.D.users[id].name, items:S.D.abw.filter(a => a.uid===id && (a.status==="genehmigt" || a.status==="offen") && (S.calAll || a.typ==="U"))});
    });
  } else {
    const me = S.D.me.id;
    out.push({id:me, name:S.D.me.name+" (du)", items:S.D.abw.filter(a => a.uid===me && (a.status==="genehmigt" || a.status==="offen"))});
    const by = {};
    (S.D.kal||[]).forEach(k => { (by[k.uid] = by[k.uid] || {id:k.uid, name:k.name, items:[], other:true}).items.push({typ:k.typ||"U", status:"genehmigt", von:k.von, bis:k.bis, ganz:k.ganz!==false}); });
    Object.values(by).sort((a,b) => a.name.localeCompare(b.name,"de")).forEach(r => out.push(r));
  }
  return out;
}

  const days = []; for(let i=1;i<=n;i++) days.push(ym+"-"+pad(i));
  const rows = calRows();
  const present = days.map(() => 0), away = days.map(() => 0), uAway = days.map(() => 0), planned = days.map(() => 0);
  const body = rows.map(r => {
    const st = S.D.users[r.id];
    return `<tr><td class="nm" title="${esc(r.name)}">${esc(r.name)}</td>${days.map((d, i) => {
      const wd = wdIdx(d), hol = Calc.holName(d);
      const soll = st ? S.K.modelH(st, d) : (wd < 6 && !hol ? 1 : 0);
      const hits = r.items.filter(a => d >= a.von && d <= (a.bis || a.von));
      let cellCls = hol ? "ho" : wd >= 5 ? "we" : "";
      if(st && !soll && !hol && !hits.length) cellCls += " free";
      let inner = "";
      if(hits.length){
        const a = hits.find(x => x.status === "genehmigt") || hits[0];
        const isOpen = a.status === "offen";
        const thin = st && !soll;
        const code = a.typ === "U" ? "U" : a.typ;
        const tip = `${r.name}: ${Calc.codeName(a.typ)}${isOpen?" (beantragt)":""}${a.storno==="beantragt"?" (Storno beantragt)":""}, ${zeitraum(a)}`;
        inner = `<span class="ab ${isOpen?"open":code}${a.storno==="beantragt"?" storno":""}${thin?" thin":""}" title="${esc(tip)}"${mgr&&isOpen?` data-goto="antraege" style="cursor:pointer"`:""}>${a.ganz===false?"½":code==="AW"?"–":code}</span>`;
        if(!thin){
          if(isOpen) planned[i]++;
          else { if(a.ganz !== false) away[i]++; if(a.typ==="U") uAway[i]++; }
        }
      }
      if(st && soll > 0 && !(hits.length && hits.some(x => x.status==="genehmigt" && x.ganz !== false))) present[i]++;
      return `<td class="${cellCls}">${inner}</td>`;
    }).join("")}</tr>`;
  }).join("");
  const head = `<tr><th class="nm">${MONATE[m-1]} ${y}</th>${days.map(d => { const wd = wdIdx(d), hol = Calc.holName(d);
    return `<th class="${hol?"ho":wd>=5?"we":""} ${d===t?"td":""}" title="${esc(hol||"")}">${WD[wd]}<br>${+d.slice(8)}</th>`; }).join("")}</tr>`;
  const foot = mgr ? `<tfoot><tr><td class="nm">Im Dienst</td>${days.map((d,i) => { const wd = wdIdx(d), hol = Calc.holName(d);
      const shop = wd < 6 && !hol; const c = shop && present[i] === 0 && rows.length ? "low" : "";
      return `<td class="${c} ${hol?"ho":wd>=5?"we":""}" title="${present[i]} im Dienst laut Stundenmodell">${shop||present[i]?present[i]:""}</td>`; }).join("")}</tr>
    <tr><td class="nm">Urlaub gleichzeitig</td>${days.map((d,i) => `<td class="${uAway[i]>=2?"two":""}" title="${uAway[i]} im Urlaub${planned[i]?", "+planned[i]+" beantragt":""}">${uAway[i]||""}${planned[i]?`<span class="muted">+${planned[i]}</span>`:""}</td>`).join("")}</tr></tfoot>` : "";
  // Monatsliste darunter
  const list = [];
  rows.forEach(r => r.items.filter(a => a.von <= days[n-1] && (a.bis||a.von) >= days[0]).forEach(a => list.push({r, a})));
  list.sort((x,y) => x.a.von.localeCompare(y.a.von));
  return `<section class="sec"><div class="sec-head"><h2>Kalender</h2><span class="sp"></span>
      ${mgr?`<label class="check small"><input type="checkbox" id="calAll" ${S.calAll?"checked":""}> alle Abwesenheiten (sonst nur Urlaub)</label>`:""}${calNav()}</div>
    <div class="legend"><span><span class="ab U">U</span>Urlaub</span>${mgr?`<span><span class="ab K">K</span>Krankenstand</span><span><span class="ab A">A</span>Arztbesuch</span><span><span class="ab ZA">ZA</span>Zeitausgleich</span><span><span class="ab PF">PF</span>Pflegefreistellung/Sonderurlaub</span>`:`<span><span class="ab AW">–</span>abwesend</span>`}
      <span><span class="ab open">U</span>beantragt, noch offen</span><span><span class="ab U">½</span>stundenweise</span><span>gestreift = laut Stundenmodell frei</span></div>
    ${rows.length?`<div class="tablebox"><table class="cal"><thead>${head}</thead><tbody>${body}</tbody>${foot}</table></div>`:`<div class="empty">Noch keine Mitarbeiter.</div>`}
    ${mgr?`<p class="small muted">„Im Dienst“ zählt, wer laut Stundenmodell arbeitet und nicht ganztägig abwesend ist. Rot: an diesem Öffnungstag ist niemand eingeplant. Gelb: mindestens zwei gleichzeitig im Urlaub. Offene Anträge anklicken, um sie zu entscheiden.</p>`
      :`<p class="small muted">Du siehst die genehmigten Urlaube deiner Kollegen, damit ihr euch abstimmen könnt. Krankenstände erscheinen nur als „abwesend“ – der Grund wird aus Datenschutzgründen nicht angezeigt.</p>`}
    <div class="panel sec"><h3>${MONATE[m-1]} im Überblick</h3>${list.length?`<div class="list">${list.map(({r,a}) => `<div class="item"><div><strong>${esc(r.name)}</strong> · ${esc(Calc.codeName(a.typ))} · ${esc(zeitraum(a))}${a.std&&mgr?` <span class="muted small">(${fmtH(a.std)} h)</span>`:""}</div>${statusChip(a)}</div>`).join("")}</div>`:`<div class="empty">Keine Abwesenheiten in diesem Monat.</div>`}</div>
  </section>`;
}
function calNav(){
  const [y,m] = S.calYm.split("-").map(Number);
  return `<div class="row"><button class="btn sm" data-act="calPrev" aria-label="Vormonat">‹</button><strong style="min-width:120px;text-align:center">${MONATE[m-1]} ${y}</strong><button class="btn sm" data-act="calNext" aria-label="Folgemonat">›</button><button class="btn sm" data-act="calNow">Heute</button></div>`;
}

/* ---------- Manager: Monatsabschluss ---------- */
function defaultAbsYm(){ const t = S.D.today; let y = +t.slice(0,4), m = +t.slice(5,7)-1; if(m===0){ m=12; y--; } return y+"-"+pad(m); }
function changesFor(uid, ym){
  const done = confirmedYm(uid, ym), since = done ? done.ts : "";
  const list = (S.D.logs||[]).filter(x => x.uid===uid && x.datum.slice(0,7)===ym && x.ts > since).sort((a,b) => (a.datum+a.ts).localeCompare(b.datum+b.ts));
  const out = [], idx = {};
  list.forEach(x => { if(x.feld==="abw"){ out.push(x); return; } const k = x.datum+"|"+x.feld; if(idx[k]==null){ idx[k]=out.length; out.push({...x}); } else out[idx[k]].neu = x.neu; });
  return out.filter(x => x.feld==="abw" || String(x.alt)!==String(x.neu));
}
function activeIn(uid, ym){ const st = S.D.users[uid]; return S.K.inService(st, ym+"-01") || S.K.inService(st, ym+"-"+pad(Calc.daysInMonth(ym))); }
function pendingAbschluss(){
  const ym = S.absYm || defaultAbsYm();
  return staffIds().filter(id => S.D.users[id].aktiv && activeIn(id, ym) && (!confirmedYm(id, ym) || changesFor(id, ym).length)).length;
}
function vAbschluss(){
  S.absYm = S.absYm || defaultAbsYm();
  const ym = S.absYm, ids = staffIds().filter(id => activeIn(id, ym) || confirmedYm(id, ym));
  if(!staffIds().length) return emptyStaff();
  if(+ym.slice(0,4) !== S.year) return `<section class="sec"><div class="sec-head"><h2>Monatsabschluss</h2><span class="sp"></span>${monthNav("abs")}</div><div class="empty">Daten für ${ym.slice(0,4)} werden geladen …</div></section>`;
  const cards = ids.map(id => {
    const st = S.D.users[id], T = S.K.monthTotals(id, ym), ch = S.K.checks(id, ym), done = confirmedYm(id, ym), chg = changesFor(id, ym);
    const nH = ch.filter(c => c[0]==="hoch").length, nM = ch.filter(c => c[0]==="mittel").length, key = id+":"+ym;
    const status = done && chg.length ? `<span class="chip open">bestätigt ${fmtDY(done.ts.slice(0,10))}, danach ${chg.length} Änderung(en)</span>`
      : done ? `<span class="chip ok">bestätigt ${fmtDY(done.ts.slice(0,10))}${done.gesendet?" · gesendet":done.mailTo?" · Mail fehlgeschlagen":" · ohne E-Mail"}</span>` : `<span class="chip open">offen</span>`;
    const sig = !done ? "" : done.signiert ? `<span class="chip ok">unterschrieben ${fmtDY(done.signiert.slice(0,10))}</span>${done.pdfUrl?`<a class="btn sm" href="${esc(done.pdfUrl)}" target="_blank" rel="noopener">PDF</a>`:""}` : `<span class="chip open">wartet auf Unterschrift</span>`;
    return `<div class="panel sec"><div class="sec-head"><h3>${esc(st.name)}</h3>${status}${sig}<span class="sp"></span><span class="small">${nH?`<span class="neg">${nH} prüfen</span> · `:""}<span class="muted">${nM} Hinweise</span></span></div>
      <div class="slots"><span>Soll ${fmtH(T.soll)}</span><span>Ist ${fmtH(T.ist)}</span><span>Gutschrift ${fmtH(T.gut)}</span><span class="${cls(T.saldo)}">Saldo ${fmtH(T.saldo,true)}</span><span>${T.gz?"Gleitzeit":"Zeitsaldo"} ${fmtH(T.saldoEnde,true)}${T.gz?` (−${fmtH(T.gz.min)}/+${fmtH(T.gz.max)})`:""}</span>
        ${T.U?`<span>Urlaub ${fmtH(T.U)}</span>`:""}${T.K?`<span>Krank ${fmtH(T.K)}</span>`:""}${T.A?`<span>Arzt ${fmtH(T.A)}</span>`:""}</div>
      ${openKorr(id).filter(k => k.datum.slice(0,7)===ym).length || S.D.abw.some(a => a.uid===id && a.storno==="beantragt") ? `<div class="callout warn small">Es warten noch Zeitkorrekturen oder Stornoanträge dieses Mitarbeiters auf deine Freigabe (Reiter „Anträge“). Bitte vor dem Bestätigen erledigen.</div>` : ""}
      ${ch.filter(c => c[0]!=="info").length?`<ul class="small" style="margin:0;padding-left:18px">${ch.filter(c => c[0]!=="info").map(c => `<li class="${c[0]==="hoch"?"neg":""}">${esc(c[1])}: ${esc(c[2])}</li>`).join("")}</ul>`:`<div class="small pos">Keine Auffälligkeiten.</div>`}
      <div class="sec"><strong class="small">${done?"Änderungen seit der Bestätigung":"Deine Änderungen in diesem Monat"} (${chg.length})</strong>
        ${chg.length?`<ul class="small" style="margin:0;padding-left:18px">${chg.map(x => `<li>${WD[wdIdx(x.datum)]} ${fmtD(x.datum)}: ${esc(changeText(x))}</li>`).join("")}</ul>`:`<span class="small muted">Keine.</span>`}</div>
      <label class="f">Änderungshinweis an ${esc(st.name.split(" ")[0])} (optional, steht oben in der Mail)<textarea rows="2" data-free="1" data-abshint="${key}">${esc(S.absHint[key]||"")}</textarea></label>
      <div class="row"><button class="btn primary" data-act="absConfirm" data-uid="${id}">${done&&!chg.length?"Erneut senden":done?"Änderungen bestätigen und senden":"Bestätigen und senden"}</button>
        <button class="btn" data-act="absPreview" data-uid="${id}">${S.absPreview===key?"Vorschau schließen":"Mail-Vorschau"}</button>
        <span class="small muted">${st.email?"an "+esc(st.email):"Keine E-Mail hinterlegt: nur in der App sichtbar"}</span></div>
      ${S.absPreview===key?`<div class="mailprev">${S.K.reportHtml(id, ym, {changes:chg, hinweis:S.absHint[key]||"", confirmed:new Date().toISOString()})}</div>`:""}</div>`;
  }).join("");
  return `<section class="sec"><div class="sec-head"><h2>Monatsabschluss</h2><span class="sp"></span>${monthNav("abs")}</div>
    <p class="muted small mw">Mit „Bestätigen und senden“ wird der Monat abgeschlossen und der Mitarbeiter bekommt seinen Bericht per E-Mail. Deine Änderungen an seinen Zeiten und Abwesenheiten stehen automatisch als Änderungshinweis drin. Bestätigte Monate kann der Mitarbeiter nicht mehr ändern. Danach unterschreibt der Mitarbeiter den Bericht in der App (Handy, Tablet oder Geschäftsgerät); das unterschriebene PDF wird in deinem Google Drive abgelegt und dir zugeschickt.</p>
    ${cards || `<div class="empty">Keine aktiven Mitarbeiter in diesem Monat.</div>`}</section>`;
}

function satText(uid){

  const lst = mine.map(k => k+".").join(mine.length > 1 ? ", " : "").replace(/, (\d\.)$/, " und $1");

function startInfo(u){

  return `<strong>Umstieg aus dem alten System am ${fmtDY(ab)}:</strong> Trage bei „Urlaub offen zum Start“ den Urlaub ein, der laut altem System an diesem Tag noch offen ist (inkl. Anspruch ${y}). Der Jahresanspruch wird für ${y} nicht noch einmal dazugezählt, erst ab ${+y+1}. „Zeitsaldo zum Start“ = Stand im alten System am Vortag. Zeiten vor dem Start werden nicht erfasst und nicht geprüft.`;

function saPanel(){

  return `<section class="panel sec"><h2>Samstagsplan</h2>

      ${["1","2","3","4","5"].map(k => { const a = sp[k]||[]; return `<tr><td>${k}. Samstag</td>${[0,1,2].map(j => `<td>${sel(k,j,a[j])}</td><td>${std(k,j,a[j])}</td>`).join("")}</tr>`; }).join("")}

function nextSats(){
  const sp = effSaPlan(), out = []; let d = today();
  for(let i=0; i<60 && out.length<4; i++, d = addDays(d,1)){
    if(wdIdx(d) !== 5) continue;
    const n = S.K.satNr(d), a = (sp[String(n)]||[]).map(e => (S.D.users[e.uid]||{}).name||"?");
    out.push(`${fmtD(d)} (${n}.) ${a.length?esc(a.map(x => x.split(" ")[0]).join(" + ")):"laut Wochenplan"}`);
  }
  return out.join(" · ");
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", ev => {
  const tb = ev.target.closest("[data-tab]");
  if(tb){ S.tab = tb.dataset.tab; S.pwOpen = false; draw(); window.scrollTo(0,0); return; }
  const go = ev.target.closest("[data-goto]"); if(go){ S.tab = go.dataset.goto; draw(); return; }
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  const shift = (ym, n) => { const [y,m] = ym.split("-").map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
  const ensureYear = ym => { if(+ym.slice(0,4) !== S.year) act("load", {year:+ym.slice(0,4)}).catch(()=>{}); };
  switch(a){
    case "logout": call("logout").catch(()=>{}); logoutLocal(); break;
    case "pwForm": S.pwOpen = true; draw(); break;
    case "pwCancel": S.pwOpen = false; draw(); break;
    case "mPrev": case "mNext": S.viewYm = shift(S.viewYm, a==="mNext"?1:-1); draw(); ensureYear(S.viewYm); break;
    case "mNow": S.viewYm = today().slice(0,7); draw(); ensureYear(S.viewYm); break;
    case "calPrev": case "calNext": S.calYm = shift(S.calYm, a==="calNext"?1:-1); draw(); ensureYear(S.calYm); break;
    case "calNow": S.calYm = today().slice(0,7); draw(); ensureYear(S.calYm); break;
    case "absPrev": case "absNext": S.absYm = shift(S.absYm, a==="absNext"?1:-1); S.absPreview = null; draw(); ensureYear(S.absYm); break;
    case "openTimes": S.viewUid = b.dataset.uid; S.tab = "zeiten"; draw(); break;
    case "stamp":
      b.disabled = true;
      act("stamp", {}, r => (r.kommen ? "Kommen" : "Gehen")+" um "+r.time+" erfasst."+(r.pause?" Gesetzliche Pause fehlte: "+r.pause+" min automatisch gebucht (Mail an dich und den Manager).":"")).then(r => {
        if(KIOSK){ S.lastStamp = (r.kommen ? "Kommen" : "Gehen")+" um "+r.time+" erfasst."+(r.pause?" Pause "+r.pause+" min automatisch gebucht.":""); draw(); clearTimeout(kioskOutT); kioskOutT = setTimeout(() => { S.lastStamp = null; call("logout").catch(()=>{}); logoutLocal("Erfasst und abgemeldet."); }, 5000); }
      }).catch(() => { b.disabled = false; });
      break;
    case "signOpen": openSign(b.dataset.ym); break;
    case "signClose": closeSign(); break;
    case "signClear": SIG.clear(); break;
    case "signSubmit": submitSign(b); break;
    case "seen": markSeen([...unseenDecisions().map(x => "d:"+x.id+":"+x.status), ...unseenAbschl().map(x => "a:"+x.ym+":"+x.ts)]); draw(); break;
    case "withdraw":
      if(b.dataset.c !== "1"){ b.dataset.c = "1"; b.textContent = "Wirklich zurückziehen?"; return; }
      act("antragZurueck", {id:b.dataset.id}, "Antrag zurückgezogen."); break;
    case "kWithdraw": act("korrekturZurueck", {id:b.dataset.id}, "Änderungsantrag zurückgezogen."); break;
    case "kOk": b.disabled = true; act("korrekturEntscheiden", {id:b.dataset.id, ok:true}, r => "Korrektur genehmigt."+(r.mailed?" Mitarbeiter informiert.":"")).catch(()=>{ b.disabled=false; }); break;
    case "kOkAll": b.disabled = true; act("korrekturEntscheiden", {ids:openKorr(b.dataset.uid).map(k => k.id), ok:true}, r => r.count+" Korrekturen genehmigt."+(r.mailed?" Mitarbeiter informiert.":"")).catch(()=>{ b.disabled=false; }); break;
    case "kRejectOpen": S.kRejectOpen = b.dataset.id; draw(); break;
    case "kRejectCancel": S.kRejectOpen = null; draw(); break;
    case "kReject": b.disabled = true; act("korrekturEntscheiden", {id:b.dataset.id, ok:false, antwort:S.kNote[b.dataset.id]||""}, "Korrektur abgelehnt.").then(() => { S.kRejectOpen = null; draw(); }).catch(()=>{ b.disabled=false; }); break;
    case "sOk": b.disabled = true; act("stornoEntscheiden", {id:b.dataset.id, ok:true}, r => "Stornierung genehmigt und zurückgebucht."+(r.mailed?" Mitarbeiter informiert.":"")).catch(()=>{ b.disabled=false; }); break;
    case "sReject": b.disabled = true; act("stornoEntscheiden", {id:b.dataset.id, ok:false, antwort:S.kNote["s"+b.dataset.id]||""}, "Stornierung abgelehnt.").then(() => { S.kRejectOpen = null; draw(); }).catch(()=>{ b.disabled=false; }); break;
    case "stornoOpen": S.stornoOpen = b.dataset.id; draw(); break;
    case "stornoCancel": S.stornoOpen = null; draw(); break;
    case "stornoReq": b.disabled = true; act("stornoAntrag", {id:b.dataset.id, grund:S.kNote["s"+b.dataset.id]||""}, "Stornierung beantragt. Der Manager wurde informiert.").then(() => { S.stornoOpen = null; draw(); }).catch(()=>{ b.disabled=false; }); break;
    case "rejectOpen": S.rejectOpen = b.dataset.id; draw(); setTimeout(() => { const t = $("#rej"); if(t) t.focus(); }, 30); break;
    case "rejectCancel": S.rejectOpen = null; draw(); break;
    case "approve": b.disabled = true; act("entscheiden", {id:b.dataset.id, ok:true}, r => `Genehmigt: ${fmtH(r.std)} h gebucht.${r.mailed?" Mitarbeiter per Mail informiert.":""}`).catch(()=>{ b.disabled=false; }); break;
    case "reject": b.disabled = true; act("entscheiden", {id:b.dataset.id, ok:false, grund:S.note[b.dataset.id]||""}, r => "Abgelehnt."+(r.mailed?" Mitarbeiter per Mail informiert.":"")).then(() => { S.rejectOpen = null; draw(); }).catch(()=>{ b.disabled=false; }); break;
    case "abwPurgeAsk": S.purgeAsk = true; draw(); break;
    case "abwPurgeNo": S.purgeAsk = false; draw(); break;
    case "abwPurge": b.disabled = true; S.purgeAsk = false; act("abwPurge", {count:+b.dataset.n}, r => r.count+" stornierte Einträge entfernt. Die Sicherung ist per Mail unterwegs.").catch(()=>{ b.disabled = false; draw(); }); break;
    case "abwNeu": b.disabled = true; act("abwNeu", {id:b.dataset.id}, r => Math.abs(r.neu - r.alt) < 0.005 ? "Unverändert: "+fmtH(r.neu)+" h." : "Neu berechnet: "+fmtH(r.alt)+" h → "+fmtH(r.neu)+" h.").catch(()=>{ b.disabled = false; }); break;
    case "storno":
      if(b.dataset.c !== "1"){ b.dataset.c = "1"; b.textContent = "Wirklich stornieren?"; return; }
      act("storno", {id:b.dataset.id}, "Storniert und zurückgebucht."); break;
    case "absPreview": { const k = b.dataset.uid+":"+S.absYm; S.absPreview = S.absPreview===k ? null : k; draw(); break; }
    case "absConfirm": { const uid = b.dataset.uid, key = uid+":"+S.absYm; b.disabled = true; b.textContent = "Wird gesendet …";
      act("abschluss", {uid, ym:S.absYm, hinweis:S.absHint[key]||""}, r => r.mailed ? "Bestätigt und an "+r.email+" gesendet." : r.email ? "Bestätigt, aber die Mail konnte nicht gesendet werden." : "Bestätigt. Keine E-Mail hinterlegt.")
        .then(() => { S.absHint[key] = ""; S.absPreview = null; draw(); }).catch(()=>{ b.disabled=false; }); break; }
    case "editUser": S.editUid = b.dataset.uid; S.cred = null; draw(); break;
    case "cancelUser": S.editUid = null; draw(); break;
    case "delOpen": S.delOpen = b.dataset.uid; draw(); break;
    case "delCancel": S.delOpen = null; draw(); break;
    case "delDo": b.disabled = true;
      call("userDelete", {id:b.dataset.uid, confirm:$("#delConf").value, year:S.year}).then(p => { S.delOpen = null; S.editUid = null; setData(p); toast(p.result.name+" gelöscht. Die Sicherung ist per E-Mail unterwegs."); })
        .catch(e => { b.disabled = false; toast(e.message, true); }); break;
    case "ausnAdd": if(!$("#xD").value || $("#xS").value === ""){ toast("Bitte Datum und Sollstunden eingeben.", true); break; }
      act("ausnahmeSave", {uid:b.dataset.uid, datum:$("#xD").value, std:num($("#xS").value), grund:$("#xG").value}, "Ausnahme gespeichert.").catch(()=>{}); break;
    case "ausnDel": act("ausnahmeDel", {id:b.dataset.id}, "Ausnahme entfernt.").catch(()=>{}); break;
    case "pwReset":
      if(b.dataset.c !== "1"){ b.dataset.c = "1"; b.textContent = "Wirklich zurücksetzen?"; return; }
      act("pwReset", {id:b.dataset.uid}).then(r => { S.cred = r; draw(); }); break;
    case "copyCred": navigator.clipboard && navigator.clipboard.writeText("Benutzername: "+S.cred.username+"\nStart-Kennwort: "+S.cred.password).then(() => toast("Kopiert."), () => toast("Bitte Text markieren und kopieren.")); break;
    case "closeCred": S.cred = null; draw(); break;
    case "ferStd": act("settingsSave", {ferien:"standard"}, "Standard-Ferientermine wiederhergestellt.").catch(()=>{}); break;
    case "url5": case "url6": { const w = Calc.avgWeek({hw:readWeeks(), h:readWeeks()[0]}); $("#uUrl").value = String(r2(w*(a==="url5"?5:6))).replace(".", ","); break; }
    case "addModel": { const ms = readModels(); ms.push({id:"", name:"Neues Modell", h:[0,0,0,0,0,0,0]}); S.D.models = ms; draw(); break; }
    case "delModel": { const ms = readModels(); ms.splice(+b.dataset.i, 1); S.D.models = ms; draw(); break; }
    case "saveModels": act("modelsSave", {models:readModels()}, "Stundenmodelle gespeichert."); break;
    case "exportDl":
      call("exportCsv", {ym:S.viewYm}).then(r => {
        try{ const blob = new Blob([r.csv], {type:"text/csv;charset=utf-8"}); const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = r.name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); toast("Download gestartet. Falls nichts passiert: „Per E-Mail an mich“ verwenden."); }
        catch(e){ toast("Download nicht möglich. Bitte „Per E-Mail an mich“ verwenden.", true); }
      }).catch(e => toast(e.message, true)); break;
    case "exportMail": act("exportMail", {ym:S.viewYm}, r => r.msg); break;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.dataset.field && t.dataset.day){
    const uid = t.dataset.uid, d = t.dataset.day;
    let v = t.value;
    if(t.dataset.field === "p") v = v === "" ? "" : String(Math.max(0, Math.min(600, Math.round(num(v)))));
    if(isMgr()){ const z = S.D.zeit[uid] = S.D.zeit[uid] || {}; const e = z[d] = Object.assign({}, z[d] || {}); e[t.dataset.field] = v; }
    else { const dr = S.draft[uid] = S.draft[uid] || {}; const e = dr[d] = Object.assign({}, inputEntry(uid, d)); e[t.dataset.field] = v; }
    queueDay(uid, d); needRender = true; return;
  }
  if(t.id === "viewUid"){ S.viewUid = t.value; draw(); return; }
  if(t.id === "calAll"){ S.calAll = t.checked; draw(); return; }
  if(t.id === "fUid"){ S.arch.uid = t.value; draw(); return; }
  if(t.id === "fTyp"){ S.arch.typ = t.value; draw(); return; }
  if(t.id === "fStatus"){ S.arch.status = t.value; draw(); return; }
  if(t.classList && t.classList.contains("sfm")){ const md = t.id.slice(3); $("#sfZ"+md).disabled = $("#sfV"+md).disabled = t.value !== "ab"; return; }
  if(t.classList && t.classList.contains("oeffm")){ const i = t.id.slice(2), m = t.value; ["oV1","oB1"].forEach(k => $("#"+k+i).disabled = m==="zu"); ["oV2","oB2"].forEach(k => $("#"+k+i).disabled = m!=="geteilt"); return; }
  if(["uAb","uEin"].includes(t.id) && $("#uStartInfo")){ $("#uStartInfo").innerHTML = startInfo({ab:$("#uAb").value, eintritt:$("#uEin").value}); return; }
  if(t.id === "aModus"){ $("#aWdhW").hidden = t.value === "antrag"; const bt = $("#directForm button[type=submit]"); if(bt) bt.textContent = t.value === "antrag" ? "Antrag anlegen" : "Eintragen und buchen"; return; }
  if(t.id === "uAuto"){ const on = t.value === "1"; $("#uAutoBW").hidden = !on; $("#uAutoInfo").hidden = !on; return; }
  if(t.id === "uVhOn"){ $("#uVhBox").hidden = !t.checked; return; }
  if(t.id === "uGz"){ document.querySelectorAll(".gzf").forEach(x => x.hidden = !t.checked); return; }
  if(t.id === "uRot"){
    const W = readWeeks(), n = +t.value, old = W.length;
    const cur = []; for(let k=0;k<n;k++) cur.push(W[k] || W[0].slice());
    $("#uWeeks").innerHTML = weeksHtml(cur); $("#uRotAbBox").hidden = n < 2; $("#uWeekLbl").textContent = n > 1 ? "Wochenschnitt" : "Wochensumme"; updWeek(); return;
  }
  if(t.id === "uModel"){ const m = (S.D.models||[]).find(x => x.id === t.value); if(m) m.h.forEach((x,i) => $("#sh"+i).value = num(x) || ""); updWeek(); return; }
  if(["aTyp","aVon","aBis","aGanz","aZv","aZb","dUid"].includes(t.id)){ if(t.id==="aVon" && $("#aBis").value < t.value) $("#aBis").value = t.value; updAntragStd(); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.dataset.note) S.note[t.dataset.note] = t.value;
  if(t.dataset.abshint) S.absHint[t.dataset.abshint] = t.value;
  if(t.dataset.knote) S.kNote[t.dataset.knote] = t.value;
  if(t.dataset.snote) S.kNote["s"+t.dataset.snote] = t.value;
  if(t.classList.contains("sh")) updWeek();
  if(t.classList.contains("vh") && $("#uVhSum")) $("#uVhSum").textContent = fmtH(WD.reduce((s,_,i) => s + num($("#vh"+i).value), 0));
});
function updWeek(){ const W = readWeeks(), e = $("#uWeek"); if(e) e.textContent = fmtH(Calc.avgWeek({hw:W, h:W[0]})); }

document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target;
  if(f.id === "loginForm"){
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true; $("#lgErr").textContent = "";
    const username = $("#lgUser").value.trim().toLowerCase(), password = $("#lgPw").value, remember = !!($("#lgRem") && $("#lgRem").checked);
    S.token = null;
    call("login", {username, password, remember, kiosk:KIOSK}).then(r => {
      S.token = r.token; store.set(r.token, r.remember); S.loginPw = password;
      armIdle();
      if(r.mustChange){ S.D = {me:r.me}; renderMustChange(); } else { S.loginPw = ""; setData(r); }
    }).catch(e => { btn.disabled = false; $("#lgErr").textContent = e.message; });
  }
  else if(f.id === "pwForm"){
    const o = $("#pwOld").value, n = $("#pwNew").value, n2 = $("#pwNew2").value;
    if(n !== n2){ $("#pwErr").textContent = "Die beiden neuen Kennwörter stimmen nicht überein."; return; }
    call("changePassword", {oldPassword:o, newPassword:n}).then(p => { S.loginPw = ""; S.pwOpen = false; toast("Kennwort geändert."); setData(p); })
      .catch(e => { $("#pwErr").textContent = e.message; });
  }
  else if(f.id === "antragForm"){
    const a = readAbs();
    act("antrag", a, "Antrag gesendet. Der Manager wurde per E-Mail informiert.").catch(()=>{});
  }
  else if(f.id === "directForm"){
    const a = readAbs(); a.uid = $("#dUid").value; a.wdhBis = ($("#aWdh")||{}).value || "";
    if(($("#aModus")||{}).value === "antrag"){ act("antragFuer", a, "Antrag angelegt. Er steht unter „Offene Anträge“ zur Bewilligung.").catch(()=>{}); return; }
    act("abwDirekt", a, r => r && (r.count > 1 || r.ferien || r.dup) ? r.count+" Termine eingetragen und gebucht."+(r.ferien?" "+r.ferien+" in den Schulferien übersprungen (Arbeitstag laut Dienstplan).":"")+(r.skip?" "+r.skip+" ohne Sollstunden übersprungen.":"")+(r.dup?" "+r.dup+" waren schon eingetragen und wurden übersprungen.":"") : "Eingetragen und gebucht.").catch(()=>{});
  }
  else if(f.id === "userForm"){
    const uid = f.dataset.uid, mid = $("#uModel").value, m = (S.D.models||[]).find(x => x.id === mid);
    const W = readWeeks(), h = W[0], rot = W.length > 1;
    let modell = "Individuell";
    if(m) modell = !rot && JSON.stringify(m.h.map(num)) === JSON.stringify(h) ? m.name : m.name+" (angepasst)";
    if(rot) modell = W.length+"-Wochen-Dienstplan";
    const d = {id: uid==="new" ? "" : uid, name:$("#uName").value, username:$("#uUser").value, email:$("#uMail").value, modellId:rot?"":mid, modell, h, hw: rot ? W : "", rotAb: rot ? $("#uRotAb").value : "",
      rolle: $("#uRolle") ? $("#uRolle").value : "", vh: $("#uVhOn").checked ? WD.map((_,i) => num($("#vh"+i).value)) : "", eintritt:$("#uEin").value, ab:$("#uAb").value, austritt:$("#uAus").value, urlaubStd:num($("#uUrl").value) || r2(Calc.avgWeek({hw:W, h})*5),
      urlaubRestVJ:num($("#uRest").value), saldoVJ:num(String($("#uSaldo").value).replace("−","-").replace("–","-")), oeffAus: !$("#uOeff").checked, jugend: $("#uJug").checked, zusatzUrl: $("#uZus").checked, autoZeit: $("#uAuto").value === "1", autoBeginn: $("#uAutoB").value, gz: $("#uGz").checked, gzMax: num($("#uGzMax").value), gzMin: num($("#uGzMin").value), aktiv: $("#uAktiv") ? $("#uAktiv").checked : true};
    act("userSave", d, uid==="new" ? null : "Gespeichert.").then(r => { S.editUid = null; if(r && r.created) S.cred = r; draw(); }).catch(()=>{});
  }
  else if(f.id === "ferForm"){
    const out = [], bad = [], iso = (d,m,y) => y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    $("#ferTxt").value.split(/\n/).map(l => l.trim()).filter(Boolean).forEach(l => {
      const m = l.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\s*(?:[–—-]\s*(\d{1,2})\.(\d{1,2})\.(\d{4}))?\s*(.*)$/);
      if(!m){ bad.push(l); return; }
      out.push([iso(m[1],m[2],m[3]), m[4] ? iso(m[4],m[5],m[6]) : iso(m[1],m[2],m[3]), m[7] || "Schulferien"]);
    });
    if(bad.length){ toast("Zeile nicht erkannt: „"+bad[0]+"“ – Format: 24.12.2026 – 06.01.2027 Weihnachtsferien"); return; }
    act("settingsSave", {ferien:out}, "Schulferien gespeichert.").catch(()=>{});
  }
  else if(f.id === "sfForm"){
    const so = {}; ["12-24","12-31"].forEach(md => { so[md] = {m:$("#sfM"+md).value, von:$("#sfV"+md).value, zeit:$("#sfZ"+md).value}; });
    act("settingsSave", {sonder:so}, "Regel für 24./31.12. gespeichert.").catch(()=>{});
  }
  else if(f.id === "uebForm"){
    const sn = v => num(String(v).replace("−","-").replace("–","-"));
    const rows = staffIds().map(id => ({id, ab:$("#ubA_"+id).value, urlaubRestVJ:sn($("#ubU_"+id).value), saldoVJ:sn($("#ubS_"+id).value)}));
    act("uebertragSave", {rows}, r => r.count+" Mitarbeiter aktualisiert.").catch(()=>{});
  }
  else if(f.id === "saForm"){
    const sp = {}; ["1","2","3","4","5"].forEach(k => { sp[k] = [0,1,2].map(j => ({uid:$(`#sp${k}_${j}`).value, std:$(`#ss${k}_${j}`).value.trim() === "" ? "" : num($(`#ss${k}_${j}`).value)})).filter(e => e.uid); });
    act("settingsSave", {saPlan:sp}, "Samstagsplan gespeichert.").catch(()=>{});
  }
  else if(f.id === "oeffForm"){
    act("settingsSave", {oeff: WD.map((_,i) => ({m:$("#oM"+i).value, v1:$("#oV1"+i).value, b1:$("#oB1"+i).value, v2:$("#oV2"+i).value, b2:$("#oB2"+i).value})), tolV:num($("#sTolV").value), tolN:num($("#sTolN").value)}, "Öffnungszeiten gespeichert.").catch(()=>{});
  }
  else if(f.id === "setForm"){
    act("settingsSave", {start:$("#sStart").value, managerMail:$("#sMail").value, appUrlExt:$("#sAppUrl").value, kalenderMA:$("#sKal").checked, gzMax:num($("#sGzMax").value), gzMin:num($("#sGzMin").value)}, "Einstellungen gespeichert.").catch(()=>{});
  }
});

setInterval(() => { const c = $("#clock"); if(c){ const n = new Date(); c.textContent = pad(n.getHours())+":"+pad(n.getMinutes()); } }, 1000);

/* ---------- Start ---------- */
const saved = KIOSK ? null : store.get();
if(saved){
  S.token = saved;
  call("load", {}).then(setData).catch(e => { if(e.code !== "auth" && e.code !== "mustChange") renderLogin(e.message); });
} else renderLogin();
})();
</script>
</body>
</html>
